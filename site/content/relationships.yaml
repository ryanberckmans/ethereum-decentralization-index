# Typed, sourced editorial connections, read "from <type> to":
#   settles-on          from lives on or settles on the network to
#   issues              from issues the asset to
#   interface-to        from is an application or product over the mechanism to
#   integrates-with     from uses or builds on to
#   collateral-for      from is used as collateral in to
#   economic-reference  from economically references to (US dollars, gold)
# None of these is a control dependency. EDI's own dependency edges come from the
# registry and are drawn separately; nothing here changes an assessment.

# WETH, Seaport and OpenSea ------------------------------------------------------

- id: opensea-marketplace-seaport16
  from: product:opensea-marketplace
  to: seaport-v1.6
  type: interface-to
  state: reproduced-observation
  sourceClaimIds: [opensea-seaport-1-6-orders, opensea-signed-zone-1-6, onchain-seaport16-2026-09]
  chainIds: [1]
  validFrom: 2024-03-25
  note: New OpenSea orders settle on Seaport 1.6

- id: opensea-marketplace-weth9
