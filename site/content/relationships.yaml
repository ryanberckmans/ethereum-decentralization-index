  state: reproduced-observation
  sourceClaimIds: [opensea-weth-offers, opensea-seaport-weth-example, onchain-seaport16-2026-09]
  chainIds: [1]
  note: Offers on OpenSea are made in WETH

- id: weth9-seaport16
  from: weth9
  to: seaport-v1.6
