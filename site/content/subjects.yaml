# Identities outside the EDI registry: organizations, products, deployments,
# networks and economic references. They are listed and searchable but are
# never graded. A deployment that shares code or a brand with an EDI record
# names it in relatedEdiId and still does not inherit its assessment.

# Organizations ---------------------------------------------------------------

- id: org:circle
  kind: organization
  name: Circle
  description: Circle Internet Financial, the company that issues USDC, holds its reserves and redeems it for US dollars.
  officialUrl: https://www.circle.com
  aliases: [Circle Internet Financial]

- id: org:opensea
  kind: organization
  name: OpenSea
  description: The company that developed the Seaport protocol in 2022 and operates the OpenSea marketplace.
  officialUrl: https://opensea.io

- id: org:visa
  kind: organization
  name: Visa
  description: A global card payments network that settles some card obligations with its partners in USDC through a stablecoin settlement program.
  officialUrl: https://usa.visa.com

- id: org:crypto-com
  kind: organization
  name: Crypto.com
  description: A crypto platform and Visa card program partner; the partner in Visa's first USDC settlement pilot in 2021.
  officialUrl: https://crypto.com

- id: org:coinbase
  kind: organization
  name: Coinbase
  description: >-
    The US exchange company that develops Base, issues cbBTC and offers its customers USDC loans against crypto through
    Morpho on Base.
  officialUrl: https://www.coinbase.com

- id: org:paxos
  kind: organization
  name: Paxos
  description: >-
    Paxos Trust Company, the issuer of PAXG and of PayPal USD (PYUSD). It holds their reserves, mints and redeems them,
    and can freeze and wipe balances.
  officialUrl: https://www.paxos.com
  aliases: [Paxos Trust Company]

- id: org:paypal
  kind: organization
  name: PayPal
  description: The payments company behind PayPal USD (PYUSD), a dollar token that Paxos issues and PayPal offers to its customers.
  officialUrl: https://www.paypal.com

- id: org:blackrock
  kind: organization
  name: BlackRock
  description: The asset manager whose BlackRock USD Institutional Digital Liquidity Fund (BUIDL) issues its shares as tokens.
  officialUrl: https://www.blackrock.com

- id: org:securitize
  kind: organization
  name: Securitize
  description: >-
    The tokenization platform and transfer agent for BUIDL. It records share ownership on chain, approves the investors
    who may hold the tokens and arranges trading for them.
  officialUrl: https://securitize.io

- id: org:uniswap-labs
  kind: organization
  name: Uniswap Labs
  description: >-
    The company that developed the Uniswap protocol versions, runs Uniswap interfaces and published the Permissioned
    Pools hook for Uniswap v4.
  officialUrl: https://uniswap.org

# Products -------------------------------------------------------------------

- id: product:opensea-marketplace
  kind: product
  name: OpenSea marketplace
  description: OpenSea's marketplace for NFTs. New orders placed through it settle on the Seaport 1.6 contract, and its offers are paid in WETH.
  officialUrl: https://opensea.io
  aliases: [OpenSea]

- id: product:visa-stablecoin-settlement
  kind: product
  name: Visa stablecoin settlement
  description: Visa's program that lets card issuers and acquirers settle their Visa obligations in stablecoins such as USDC over supported blockchains.
  officialUrl: https://corporate.visa.com/en/sites/visa-perspectives/newsroom/visa-launches-stablecoin-settlement-in-the-united-states.html

- id: product:coinbase-crypto-backed-loans
  kind: product
  name: Coinbase crypto-backed loans
  description: >-
    Coinbase's loans of USDC against its customers' bitcoin and other crypto. The variable-rate loans run on Morpho Blue
    markets on Base.
  aliases: [Coinbase bitcoin-backed loans, Coinbase loans]

- id: product:uniswapx
  kind: product
  name: UniswapX
  description: >-
    A Uniswap Labs trading system in which outside market makers fill orders that settle on chain. BUIDL trades through
    its request-for-quote framework with whitelisted market makers.
  officialUrl: https://uniswap.org

- id: product:uniswap-permissioned-pools
  kind: product
  name: Uniswap Permissioned Pools
  description: >-
    A Uniswap v4 hook standard for pools that only approved wallets can trade in or add liquidity to. The asset's issuer
    keeps the allowlist; the shared hook and factory are deployed by Uniswap.
  officialUrl: https://blog.uniswap.org/introducing-permissioned-pools-on-uniswap-v4
  aliases: [Permissioned Pools, PermissionedHooks]

# Deployments ----------------------------------------------------------------

- id: deployment:usdc-base
  kind: deployment
  name: USDC on Base
  description: Circle's native USDC contract on Base. A separate deployment from USDC on Ethereum, with its own address and no EDI record of its own.
  chainId: 8453
  address: "0x833589fCD6eDb6E08f4c7C32D4f71b54bdA02913"
  relatedEdiId: usdc

- id: deployment:weth-base
  kind: deployment
  name: WETH on Base
  description: >-
    The wrapped ETH contract on Base, a predeploy at 0x4200000000000000000000000000000000000006. A separate contract on a
    separate network from WETH9 on Ethereum, so EDI's WETH9 record does not cover it.
  chainId: 8453
  address: "0x4200000000000000000000000000000000000006"
  relatedEdiId: weth9
  aliases: [WETH on Base, Base WETH]

- id: deployment:morpho-blue-base
  kind: deployment
  name: Morpho Blue on Base
  description: >-
    The Morpho Blue lending contract on Base, at the same address as on Ethereum. A separate deployment on a separate
    network: EDI's Morpho markets record covers only the Ethereum contract.
  chainId: 8453
  address: "0xBBBBBbbBBb9cC5e90e3b3Af64bdAF62C37EEFFCb"
  relatedEdiId: morpho-blue
  aliases: [Morpho on Base]

- id: deployment:cbbtc-base
  kind: deployment
  name: cbBTC on Base
  description: >-
    Coinbase's cbBTC token contract on Base, the collateral in the Morpho market behind Coinbase's bitcoin-backed loans.
    EDI's cbBTC record covers the Ethereum contract.
  chainId: 8453
  address: "0xcbB7C0000aB88B473b1f5aFd9ef808440eed33Bf"
  relatedEdiId: cbbtc

- id: deployment:buidl-i-ethereum
  kind: deployment
  name: BUIDL I Class on Ethereum
  description: >-
    The I Class of BlackRock's BUIDL fund, a separate token contract on Ethereum with the symbol BUIDL-I. The
    directory's BUIDL figures cover the BUIDL contract only.
  chainId: 1
  address: "0x6a9DA2D710BB9B700acde7Cb81F10F1fF8C89041"
  relatedEdiId: buidl
  aliases: [BUIDL-I]

# Networks -------------------------------------------------------------------

- id: network:solana
  kind: network
  name: Solana
  description: A separate layer-1 blockchain that does not settle on Ethereum. Visa's first US banks to settle in USDC do so over Solana.
  officialUrl: https://solana.com
  ethereumRelation: outside-ethereum

# Economic references ----------------------------------------------------------

- id: ref:us-dollar
  kind: reference
  name: US dollar
  description: The United States dollar. Dollar tokens such as USDC promise redemption in it through their issuer.
  aliases: [USD, dollar]

- id: ref:gold
  kind: reference
  name: Gold
  description: Physical gold. Gold tokens such as PAXG are claims on bars held in custody by their issuer.
  aliases: [XAU, physical gold]
