# Dated numbers. Stocks need asOf, flows need an interval, rates need a
# ratePeriod. A value is an exact decimal string; a number a source does not
# give is left out, never written as zero. Observations are compared only within
# one comparisonGroup with the same unit and time basis, and never summed.
#
# Onchain observations are reproduced from evidence/onchain.json (see README.md):
# a stock dated D is the state at 00:00 UTC on D, after the last block before
# it; a flow covers every block whose timestamp falls in its UTC days, here
# September 2026.

