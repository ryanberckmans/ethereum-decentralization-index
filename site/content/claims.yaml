- id: opensea-collection-offers
  statement: >-
    OpenSea documents collection offers that apply to any NFT in a collection and are filled by the first holder who
    accepts. Collection offers use the Seaport protocol.
  sourceUrl: https://docs.opensea.io/docs/collection-offers-and-advanced-trading
  publisher: OpenSea
  title: Collection offers and advanced trading
  retrievedAt: 2026-10-02
  state: live
  subjects: [product:opensea-marketplace, seaport-v1.6]
  locator: '"A collection offer applies to any NFT in a collection. The first holder to accept it fulfills the order."'

- id: opensea-offer-leverage
  statement: >-
    OpenSea lets the total of a buyer's outstanding WETH offers reach 1,000 times their WETH balance, for both item and
    collection offers: with 1 WETH, a buyer can bid up to 1,000 WETH across open offers.
  sourceUrl: https://docs.opensea.io/docs/offer-leverage
  publisher: OpenSea
  title: Offer leverage
  retrievedAt: 2026-10-02
  state: live
  subjects: [product:opensea-marketplace, weth9]
  locator: '"With 1 WETH balance, you can bid up to 1000 WETH."'

- id: opensea-offchain-cancellation
  statement: >-
    OpenSea documents that cancelling an order off-chain stops OpenSea from issuing new fulfillment signatures for it
    and relies on OpenSea's order book, while an on-chain cancellation is permanent and costs gas.
  sourceUrl: https://docs.opensea.io/docs/collection-offers-and-advanced-trading
  publisher: OpenSea
  title: Collection offers and advanced trading
  retrievedAt: 2026-10-02
  state: live
  subjects: [product:opensea-marketplace, seaport-v1.6]
  locator: 'Canceling orders: "Off-chain (gas-free) cancellation"'

