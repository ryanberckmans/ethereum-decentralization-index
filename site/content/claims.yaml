  statement: Morpho announced on 10 January 2024 that Morpho Blue was live on Ethereum mainnet.
  sourceUrl: https://x.com/Morpho/status/1745083606857384106
  publisher: Morpho (@Morpho on X)
  title: Morpho Blue is officially live on Mainnet
  sourcePublishedAt: 2024-01-10
  retrievedAt: 2026-10-02
  state: live
  subjects: [morpho-blue]
