  sourceUrl: https://docs.opensea.io/docs/collection-offers-and-advanced-trading
  publisher: OpenSea
  title: Collection offers and advanced trading
  retrievedAt: 2026-10-02
  state: live
  subjects: [weth9, product:opensea-marketplace]
  locator: '"Offers on OpenSea require WETH (Wrapped ETH)."'

- id: opensea-seaport-1-6-orders
  statement: >-
    OpenSea's developer documentation states that new OpenSea orders use Seaport 1.6 at
    0x0000000000000068F116a894984e2DB1123eB395, while older orders may remain on Seaport 1.5.
  sourceUrl: https://docs.opensea.io/docs/collection-offers-and-advanced-trading
  publisher: OpenSea
  title: Collection offers and advanced trading
  retrievedAt: 2026-10-02
  state: live
  subjects: [seaport-v1.6, product:opensea-marketplace]
