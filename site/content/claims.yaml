# Source claims: what one source supports, stated narrowly, with its evidence
# state. `locator` quotes or names the passage. `retrievedAt` is when an editor
# read the source; `sourcePublishedAt` and `observedAt` come from the source.
#
# Onchain claims (state reproduced-observation) cite evidence/onchain.json,
# which records each read's chain, pinned block and result. Re-run them with
# evidence/onchain.mjs against any archive node.

# Wrapped ETH -------------------------------------------------------------------

- id: ethereum-org-why-weth
  statement: >-
    ethereum.org explains that ETH predates the ERC-20 token standard, so applications built for ERC-20 tokens cannot use
    native ETH directly. The WETH contract accepts any amount of ETH and mints the same amount of WETH, and redeems WETH
    for the same amount of ETH.
  sourceUrl: https://ethereum.org/wrapped-eth/
  publisher: ethereum.org
  title: What is Wrapped Ether (WETH)
  retrievedAt: 2026-10-02
  state: capability
  subjects: [weth9, native-eth]
  locator: '"Since ETH predates the ERC-20 standard, ETH doesn''t conform to this specification."'

- id: ethereum-org-weth-variants
  statement: >-
    ethereum.org warns that besides the canonical WETH contract on Ethereum there are other WETH variants, including
    versions on other blockchains, which may behave differently or have different security properties. It lists
    separate WETH addresses for Arbitrum and Optimism.
  sourceUrl: https://ethereum.org/wrapped-eth/
  publisher: ethereum.org
  title: What is Wrapped Ether (WETH)
  retrievedAt: 2026-10-02
  state: capability
  subjects: [weth9]
  locator: 'FAQ, "Why am I seeing different WETH tokens?"'

- id: sourcify-weth9-source
  statement: >-
    Sourcify holds a verified source match for the WETH9 contract at 0xC02aaA39b223FE8D0A0e5C4F27eAD9083C756Cc2 on
    Ethereum, deployed in block 4,719,568. Its deposit function credits the sender's balance, withdraw returns ETH, and
    totalSupply returns the contract's own ETH balance. The source defines no owner, administrator or pause function.
  sourceUrl: https://repo.sourcify.dev/1/0xC02aaA39b223FE8D0A0e5C4F27eAD9083C756Cc2
  publisher: Sourcify
  title: WETH9 verified source on Ethereum Mainnet
  retrievedAt: 2026-10-02
  state: capability
  subjects: [weth9, native-eth]
  locator: 'WETH9.sol, function totalSupply(): "return this.balance;"'

- id: base-weth9-address
  statement: >-
    Base's documentation lists WETH9 on Base Mainnet at 0x4200000000000000000000000000000000000006, a different address
    on a different network from WETH9 on Ethereum.
  sourceUrl: https://docs.base.org/specifications/reference/base-contracts
  publisher: Base
  title: Base contracts
  retrievedAt: 2026-10-02
  state: capability
  subjects: [deployment:weth-base, weth9, base]
  locator: 'L2 Contract Addresses, Base Mainnet: "WETH9 | 0x4200000000000000000000000000000000000006"'

- id: zellic-weth-verification
  statement: >-
    Zellic formally verified two properties of WETH9 with the Z3 theorem prover: a depositor can always withdraw their
    ETH whatever other users do, and totalSupply is always at least the number of WETH tokens in existence. It can be
    higher because ETH sent by SELFDESTRUCT or as a block reward raises the balance without minting WETH.
  sourceUrl: https://www.zellic.io/blog/formal-verification-weth/
  publisher: Zellic
  title: Formally Verifying the World's Most Popular Smart Contract
  sourcePublishedAt: 2022-11-18
  retrievedAt: 2026-10-02
  state: capability
  subjects: [weth9]
  locator: Conclusion
  qualification: A formal model of the contract's own rules, not an audit of every application that uses WETH.

- id: zellic-weth-usage-2022
  statement: >-
    Zellic counted WETH9 in over 125 million Ethereum transactions by November 2022, which it put at over 7% of all
    Ethereum transactions to that date.
  sourceUrl: https://www.zellic.io/blog/formal-verification-weth/
  publisher: Zellic
  title: Formally Verifying the World's Most Popular Smart Contract
  sourcePublishedAt: 2022-11-18
  observedAt: 2022-11-18
  retrievedAt: 2026-10-02
  state: reported-adoption
  subjects: [weth9]
  locator: 'Background: "WETH has been involved in over 125 million transactions"'
  qualification: A third-party count from 2022, not reproduced here. Transactions are not people or trades.

