# Visa settlement -------------------------------------------------------------------

- id: visa-usdc-pilot-2021
  statement: >-
    In March 2021 Visa announced that it had settled a transaction in USDC over Ethereum, in a pilot that let Crypto.com
    send USDC to Visa to settle a portion of its obligations for the Crypto.com Visa card program.
  sourceUrl: https://usa.visa.com/about-visa/newsroom/press-releases.releaseId.17821.html
  publisher: Visa
  title: Visa Becomes First Major Payments Network to Settle Transactions in USD Coin (USDC)
  sourcePublishedAt: 2021-03-29
  retrievedAt: 2026-10-02
  state: pilot
  subjects: [usdc, ethereum, org:visa, org:crypto-com]
  locator: '"to settle a transaction with Visa over Ethereum"'

- id: visa-usdc-ethereum-settlement-2023
  statement: >-
    In September 2023 Visa reported that Crypto.com uses USDC to fulfil its settlement obligations on its Visa card
    program in Australia. Settling cross-border purchases had required a days-long currency conversion and international
    wires; Crypto.com can now send USDC over Ethereum directly to a Visa treasury-managed Circle account instead.
  sourceUrl: https://usa.visa.com/about-visa/newsroom/press-releases.releaseId.19881.html
  publisher: Visa
  title: Visa Expands Stablecoin Settlement Capabilities to Merchant Acquirers
  sourcePublishedAt: 2023-09-05
  retrievedAt: 2026-10-02
  state: reported-adoption
  subjects: [usdc, ethereum, org:visa, org:crypto-com, product:visa-stablecoin-settlement]
  locator: '"Crypto.com now uses USDC to fulfill its settlement obligations on the Visa card in Australia"'
  qualification: The same release adds Solana for other partners; it gives no amount for the Ethereum route.

- id: visa-us-settlement-2025
  statement: >-
    In December 2025 Visa launched USDC settlement for US issuers and acquirers. Its first banking participants settle
    over Solana. Visa reported that its monthly stablecoin settlement volume passed a 3.5 billion dollar annualized run
    rate as of 30 November 2025.
  sourceUrl: https://corporate.visa.com/en/sites/visa-perspectives/newsroom/visa-launches-stablecoin-settlement-in-the-united-states.html
  publisher: Visa
  title: Visa Launches Stablecoin Settlement in the United States
  sourcePublishedAt: 2025-12-16
  observedAt: 2025-11-30
  retrievedAt: 2026-10-02
  state: reported-adoption
  subjects: [product:visa-stablecoin-settlement, org:visa, usdc, network:solana]
  locator: '"which have started settling with Visa in USDC over the Solana blockchain"'
  qualification: The run rate covers all of Visa's stablecoin settlement across chains; it is not an Ethereum figure.

- id: visa-nine-chains-2026
  statement: >-
    In April 2026 Visa reported that its stablecoin settlement pilot supports nine blockchains, adding Arc, Base,
    Canton, Polygon and Tempo to Avalanche, Ethereum, Solana and Stellar, and had reached a 7 billion dollar annualized
    settlement run rate.
  sourceUrl: https://investor.visa.com/news/news-details/2026/Visa-Accelerates-Stablecoin-Momentum-Adding-Five-Blockchains-for-Settlement/
  publisher: Visa
  title: 'Visa Accelerates Stablecoin Momentum: Adding Five Blockchains for Settlement'
  sourcePublishedAt: 2026-04-29
  observedAt: 2026-04-29
  retrievedAt: 2026-10-02
  state: reported-adoption
  subjects: [product:visa-stablecoin-settlement, org:visa, ethereum, base]
  locator: '"has reached a $7 billion annualized stablecoin settlement run rate"'
  qualification: Run rate across nine blockchains and all supported stablecoins. Visa gives no Ethereum-only figure.
