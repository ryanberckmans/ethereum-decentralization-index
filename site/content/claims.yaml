- id: morpho-deposits-2024
  statement: >-
    Morpho said on 1 August 2024 that Morpho Blue had passed 1.7 billion dollars in total deposits in the six months
    since launching on Ethereum, and that its recent deployment on Base had reached 120 million dollars in deposits in
    less than a month.
  sourceUrl: https://morpho.org/blog/morpho-secures-50m-in-funding-led-by-ribbit-capital/
  publisher: Morpho
  title: Morpho Secures $50M in Funding, Led by Ribbit Capital
  sourcePublishedAt: 2024-08-01
  observedAt: 2024-08-01
  retrievedAt: 2026-10-02
  state: reported-adoption
  subjects: [morpho-blue, deployment:morpho-blue-base]
  locator: '"In just six months since launching on Ethereum, it surpassed $1.7B in total deposits"'
  qualification: Morpho's own figures. Deposits are assets supplied, not loans outstanding; the two networks are reported separately.

- id: morpho-docs-governance
  statement: >-
    Morpho's documentation says Morpho governance is intentionally limited in scope and the core contract code is
    immutable. Governance's powers include turning on a fee of at most 25% of the interest borrowers pay, setting the
    fee recipient, and whitelisting new liquidation loan-to-value ratios (LLTVs) and interest rate models.
  sourceUrl: https://docs.morpho.org/learn/governance/organization
  publisher: Morpho
  title: Morpho Governance
  retrievedAt: 2026-10-02
  state: capability
  subjects: [morpho-blue, token:morpho]
  locator: '"Morpho Protocol governance is intentionally limited in scope. The core smart contract code is immutable."'
  qualification: The same list includes ownership of the upgradeable MORPHO token contract, a separate EDI record.

- id: morpho-docs-governance-multisig
  statement: >-
    Morpho's documentation names Morpho governance as morpho.eth, a 5-of-9 multisig at
    0xcBa28b38103307Ec8dA98377ffF9816C164f9AFa, on both Ethereum and Base. MORPHO holders vote on Snapshot, and the
    multisig carries out actions a vote approves.
  sourceUrl: https://docs.morpho.org/learn/governance/organization
  publisher: Morpho
  title: Morpho Governance
  retrievedAt: 2026-10-02
  state: live
  subjects: [morpho-blue, deployment:morpho-blue-base, token:morpho]
  locator: 'Multisig and Addresses: "morpho.eth (5/9 multisig): 0xcBa28b38103307Ec8dA98377ffF9816C164f9AFa"'

- id: morpho-docs-owner-powers
  statement: >-
    Morpho Blue's contract reference says its owner can change the owner, set fees on markets and the fee recipient,
    and enable, but not disable, interest rate models and LLTVs.
  sourceUrl: https://docs.morpho.org/developers/contracts/blue
  publisher: Morpho
  title: Blue
  retrievedAt: 2026-10-02
  state: capability
  subjects: [morpho-blue]
  locator: 'owner(): "It has the power to enable but not disable IRMs and LLTVs."'

- id: morpho-docs-permissionless-markets
  statement: >-
    Morpho's documentation says anyone can create an isolated Morpho Blue lending market without a governance vote. A
    market is defined by five parameters: the collateral asset, the loan asset, the LLTV, the oracle and the interest
    rate model. They are fixed at creation, and the LLTV and rate model must come from options governance approved.
  sourceUrl: https://docs.morpho.org/learn/concepts/blue
  publisher: Morpho
  title: Variable Rate Market (Morpho Blue)
  retrievedAt: 2026-10-02
  state: capability
  subjects: [morpho-blue]
  locator: '"In Morpho, each parameter is selected at market creation and persists in perpetuity."'

- id: morpho-docs-oracle-per-market
  statement: >-
    Morpho's documentation says each market's oracle is chosen by the market's curators, not by Morpho, and cannot be
    changed once the market is deployed.
  sourceUrl: https://docs.morpho.org/learn/concepts/oracle
  publisher: Morpho
  title: Oracle
  retrievedAt: 2026-10-02
  state: capability
  subjects: [morpho-blue]
  locator: '"Market curators (not Morpho) are responsible for selecting and implementing appropriate oracles for their markets."'

- id: morpho-docs-lender-risks
  statement: >-
    Morpho's risk documentation warns lenders that a lack of liquidity can prevent them from withdrawing for a period
    of time, and that if collateral falls below a position's debt before it is liquidated, the borrower has no incentive
    to repay.
  sourceUrl: https://docs.morpho.org/learn/resources/risks
  publisher: Morpho
  title: Risk & Security Documentation
  retrievedAt: 2026-10-02
  state: capability
  subjects: [morpho-blue]
  locator: 'Liquidity Risk (for lenders): "A lack of liquidity can prevent suppliers from withdrawing their assets for a certain period of time."'

- id: morpho-docs-adaptive-curve-irm
  statement: >-
    Morpho's documentation describes the AdaptiveCurveIRM: when a market's utilization stays above its 90% target the
    rate curve keeps shifting upward, and at 100% utilization the rate at target doubles every five days, the fastest
    it can move.
  sourceUrl: https://docs.morpho.org/learn/concepts/irm
  publisher: Morpho
  title: Interest Rate Model
  retrievedAt: 2026-10-02
  state: capability
  subjects: [morpho-blue]
  locator: '"If the utilization remains at 100%, it will progressively increase until it doubles after 5 days."'

