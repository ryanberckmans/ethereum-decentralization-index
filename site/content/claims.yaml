- id: opensea-signed-zone-source
  statement: >-
    The verified source of the zone at 0x000056F7000000EcE9003ca63978907a00FFD100 is a SignedZone contract that requires
    each order it guards to be signed by a signer its controller has approved, under Seaport improvement proposal SIP-7.
  sourceUrl: https://eth.blockscout.com/address/0x000056F7000000EcE9003ca63978907a00FFD100?tab=contract
  publisher: Blockscout
  title: SignedZone verified contract on Ethereum
  retrievedAt: 2026-10-02
  state: capability
  subjects: [product:opensea-marketplace, seaport-v1.6]
  locator: '"SignedZone is an implementation of SIP-7 that requires orders to be signed by an approved signer."'

