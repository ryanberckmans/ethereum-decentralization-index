# ETH -------------------------------------------------------------------------------

- id: ethereum-org-what-is-ether
  statement: >-
    ethereum.org describes ETH as Ethereum's native currency: it pays the network's transaction fees (gas), secures
    the network through staking and serves as money for payments and investment.
  sourceUrl: https://ethereum.org/what-is-ether/
  publisher: ethereum.org
  title: What is ether (ETH)?
  sourcePublishedAt: 2026-08-06
  retrievedAt: 2026-10-02
  state: live
  subjects: [native-eth, ethereum]
  locator: '"It''s used to pay transaction fees (known as ''gas'') for using the network and the applications built on top of it, to secure the network through staking"'

- id: ethereum-org-ether-fees-only
  statement: >-
    ethereum.org's technical introduction to ether says it is the only accepted payment for transaction fees and,
    since The Merge, is required to validate and propose blocks on Ethereum mainnet. It is also used as collateral in
    lending markets and as a unit of account in NFT marketplaces.
  sourceUrl: https://ethereum.org/developers/docs/intro-to-ether/
  publisher: ethereum.org
  title: Technical intro to ether
  sourcePublishedAt: 2025-08-07
  retrievedAt: 2026-10-02
  state: live
  subjects: [native-eth, ethereum]
  locator: '"Fundamentally, it is the only acceptable form of payment for transaction fees"'

- id: ethereum-org-ether-issuance
  statement: >-
    ethereum.org says new ether is created only by the Ethereum protocol, as a reward for proposing blocks and for
    other validator work; no user can create it.
  sourceUrl: https://ethereum.org/developers/docs/intro-to-ether/
  publisher: ethereum.org
  title: Technical intro to ether
  sourcePublishedAt: 2025-08-07
  retrievedAt: 2026-10-02
  state: capability
  subjects: [native-eth, ethereum]
  locator: 'Minting ether: "The underlying Ethereum protocol creates the new ether, and it is not possible for a user to create ether."'

- id: ethereum-org-base-fee-burned
  statement: >-
    ethereum.org's page on gas says every block has a base fee set by the protocol from the blocks before it, and that
    the base fee is burned, removed from circulation, when the block is created. Only the tip goes to the validator.
  sourceUrl: https://ethereum.org/developers/docs/gas/
  publisher: ethereum.org
  title: Gas and fees
  sourcePublishedAt: 2026-06-24
  retrievedAt: 2026-10-02
  state: live
  subjects: [native-eth, ethereum]
  locator: 'Base fee: "When the block is created this base fee is ''burned'', removing it from circulation."'

- id: eip-1559-base-fee-burned
  statement: >-
    EIP-1559, a final standard created in April 2019, specifies that the base fee is always burned by the protocol and
    block producers keep only the priority fee, so that only ETH can ever pay for transactions on Ethereum.
  sourceUrl: https://eips.ethereum.org/EIPS/eip-1559
  publisher: Ethereum Improvement Proposals
  title: 'EIP-1559: Fee market change for ETH 1.0 chain'
  sourcePublishedAt: 2019-04-13
  retrievedAt: 2026-10-02
  state: capability
  subjects: [native-eth, ethereum]
  locator: 'Motivation: "The base fee is always burned (i.e. it is destroyed by the protocol)."'
  qualification: The specification predates The Merge and says miners where validators now propose blocks.

- id: ethereum-org-burn-since-london
  statement: ethereum.org says fee burning went live with the London upgrade in August 2021 and has not changed since The Merge.
  sourceUrl: https://ethereum.org/roadmap/merge/issuance/
  publisher: ethereum.org
  title: How The Merge impacted ETH supply
  sourcePublishedAt: 2026-06-06
  retrievedAt: 2026-10-02
  state: live
  subjects: [native-eth, ethereum]
  locator: 'The burn: "Fee burning went live with the London upgrade in August 2021, and remains unchanged since The Merge."'

- id: ethereum-org-staking
  statement: >-
    ethereum.org describes staking as depositing ETH to activate a validator, which proposes blocks and attests to the
    head of the chain. A validator needs at least 32 ETH and can hold up to 2,048 ETH.
  sourceUrl: https://ethereum.org/staking/
  publisher: ethereum.org
  title: Earn rewards while securing Ethereum
  retrievedAt: 2026-10-02
  state: live
  subjects: [native-eth, ethereum]
  locator: '"Your own validator requires at least 32 ETH and can hold up to 2048 ETH."'
  qualification: The page's displayed update date predates the May 2025 upgrade it describes, so it is not used as a date here.

- id: ethereum-org-accounts
  statement: >-
    ethereum.org defines an Ethereum account as an entity with an ETH balance that can send messages on Ethereum,
    controlled either by a user or by contract code. The balance is part of the account's state.
  sourceUrl: https://ethereum.org/developers/docs/accounts/
  publisher: ethereum.org
  title: Ethereum accounts
  sourcePublishedAt: 2026-08-06
  retrievedAt: 2026-10-02
  state: capability
  subjects: [native-eth, ethereum]
  locator: '"An Ethereum account is an entity with an ether (ETH) balance that can send messages on Ethereum."'

- id: eip-4844-blob-fee-burned
  statement: >-
    EIP-4844, a final standard that added data blobs to Ethereum for rollups, specifies that a blob transaction's blob
    fee is deducted from the sender and burned, and is not refunded if the transaction fails.
  sourceUrl: https://eips.ethereum.org/EIPS/eip-4844
  publisher: Ethereum Improvement Proposals
  title: 'EIP-4844: Shard Blob Transactions'
  sourcePublishedAt: 2022-02-25
  retrievedAt: 2026-10-02
  state: capability
  subjects: [native-eth, ethereum]
  locator: 'Gas accounting: "is deducted from the sender balance before transaction execution and burned"'

- id: onchain-ethereum-blocks-2026-09
  statement: >-
    In September 2026 (blocks 25,878,705 to 26,093,737, 215,033 blocks) Ethereum mainnet included 56,880,856
    transactions using 6,522,419,274,588 gas. Their base fees, which the protocol burns, came to 1,881.239 ETH. 183,813
    of the blocks carried blobs, whose fees burned a further 2.830 ETH.
  sourceUrl: https://github.com/ryanberckmans/ethereum-decentralization-index/blob/main/site/content/evidence/onchain.json
  publisher: Ethereum mainnet, read by the directory
  title: Onchain reads at pinned blocks
  observedAt: 2026-09-30
  retrievedAt: 2026-10-02
  state: reproduced-observation
  subjects: [ethereum, native-eth]
  locator: read ethereum-blocks-2026-09
  qualification: Summed from every block header in the range. Tips paid to validators are not burned and are not included.

