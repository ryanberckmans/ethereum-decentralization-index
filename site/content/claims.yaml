# Wrapped ETH -------------------------------------------------------------------

- id: ethereum-org-why-weth
  statement: >-
    ethereum.org explains that ETH predates the ERC-20 token standard, so applications built for ERC-20 tokens cannot use
    native ETH directly. The WETH contract accepts any amount of ETH and mints the same amount of WETH, and redeems WETH
    for the same amount of ETH.
  sourceUrl: https://ethereum.org/wrapped-eth/
  publisher: ethereum.org
  title: What is Wrapped Ether (WETH)
  retrievedAt: 2026-10-02
  state: capability
  subjects: [weth9, native-eth]
  locator: '"Since ETH predates the ERC-20 standard, ETH doesn''t conform to this specification."'

- id: ethereum-org-weth-variants
  statement: >-
    ethereum.org warns that besides the canonical WETH contract on Ethereum there are other WETH variants, including
    versions on other blockchains, which may behave differently or have different security properties. It lists
    separate WETH addresses for Arbitrum and Optimism.
  sourceUrl: https://ethereum.org/wrapped-eth/
  publisher: ethereum.org
  title: What is Wrapped Ether (WETH)
  retrievedAt: 2026-10-02
  state: capability
  subjects: [weth9]
  locator: 'FAQ, "Why am I seeing different WETH tokens?"'

- id: sourcify-weth9-source
  statement: >-
    Sourcify holds a verified source match for the WETH9 contract at 0xC02aaA39b223FE8D0A0e5C4F27eAD9083C756Cc2 on
    Ethereum, deployed in block 4,719,568. Its deposit function credits the sender's balance, withdraw returns ETH, and
    totalSupply returns the contract's own ETH balance. The source defines no owner, administrator or pause function.
  sourceUrl: https://repo.sourcify.dev/1/0xC02aaA39b223FE8D0A0e5C4F27eAD9083C756Cc2
  publisher: Sourcify
  title: WETH9 verified source on Ethereum Mainnet
  retrievedAt: 2026-10-02
  state: capability
  subjects: [weth9, native-eth]
  locator: 'WETH9.sol, function totalSupply(): "return this.balance;"'

- id: base-weth9-address
  statement: >-
    Base's documentation lists WETH9 on Base Mainnet at 0x4200000000000000000000000000000000000006, a different address
    on a different network from WETH9 on Ethereum.
  sourceUrl: https://docs.base.org/specifications/reference/base-contracts
  publisher: Base
  title: Base contracts
  retrievedAt: 2026-10-02
  state: capability
  subjects: [deployment:weth-base, weth9, base]
