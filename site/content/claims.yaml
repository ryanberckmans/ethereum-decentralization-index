- id: uniswap-v3-intro-idle-capital
  statement: >-
    Introducing v3, Uniswap Labs wrote that a v2 pool spreads its liquidity across every price from zero to infinity,
    so for most pools the majority of it is never used, and that v3 lets liquidity providers concentrate capital within
