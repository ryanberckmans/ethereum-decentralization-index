- id: zellic-weth-verification
  statement: >-
    Zellic formally verified two properties of WETH9 with the Z3 theorem prover: a depositor can always withdraw their
    ETH whatever other users do, and totalSupply is always at least the number of WETH tokens in existence. It can be
    higher because ETH sent by SELFDESTRUCT or as a block reward raises the balance without minting WETH.
  sourceUrl: https://www.zellic.io/blog/formal-verification-weth/
  publisher: Zellic
  title: Formally Verifying the World's Most Popular Smart Contract
  sourcePublishedAt: 2022-11-18
  retrievedAt: 2026-10-02
  state: capability
  subjects: [weth9]
  locator: Conclusion
  qualification: A formal model of the contract's own rules, not an audit of every application that uses WETH.

- id: zellic-weth-usage-2022
  statement: >-
    Zellic counted WETH9 in over 125 million Ethereum transactions by November 2022, which it put at over 7% of all
    Ethereum transactions to that date.
  sourceUrl: https://www.zellic.io/blog/formal-verification-weth/
  publisher: Zellic
  title: Formally Verifying the World's Most Popular Smart Contract
  sourcePublishedAt: 2022-11-18
  observedAt: 2022-11-18
  retrievedAt: 2026-10-02
  state: reported-adoption
  subjects: [weth9]
  locator: 'Background: "WETH has been involved in over 125 million transactions"'
  qualification: A third-party count from 2022, not reproduced here. Transactions are not people or trades.

