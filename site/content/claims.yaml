# BUIDL -------------------------------------------------------------------------------

- id: buidl-launch-2024
  statement: >-
    BlackRock announced on 20 March 2024 its first tokenized fund issued on a public blockchain, the BlackRock USD
    Institutional Digital Liquidity Fund (BUIDL), through which qualified investors earn US dollar yields by subscribing
    via Securitize Markets.
  sourceUrl: https://www.silicon.co.uk/press-release/blackrock-launches-its-first-tokenized-fund-buidl-on-the-ethereum-network
  publisher: BlackRock and Securitize (press release, syndicated by Silicon UK)
  title: BlackRock Launches Its First Tokenized Fund, BUIDL, on the Ethereum Network
  sourcePublishedAt: 2024-03-20
  retrievedAt: 2026-10-02
  state: live
  subjects: [buidl, org:blackrock, org:securitize]
  locator: '"BlackRock today unveils its first tokenized fund issued on a public blockchain"'
  qualification: Only the headline names Ethereum; BlackRock's November 2024 release confirms the March 2024 launch was on Ethereum.

- id: buidl-design-2024
  statement: >-
    At launch BUIDL sought a stable value of 1 dollar per token and invested all its assets in cash, US Treasury bills
    and repurchase agreements. Dividends accrue daily and are paid monthly as new tokens, and holders can transfer
    tokens at any hour, but only to other pre-approved investors.
  sourceUrl: https://www.silicon.co.uk/press-release/blackrock-launches-its-first-tokenized-fund-buidl-on-the-ethereum-network
  publisher: BlackRock and Securitize (press release, syndicated by Silicon UK)
  title: BlackRock Launches Its First Tokenized Fund, BUIDL, on the Ethereum Network
  sourcePublishedAt: 2024-03-20
  retrievedAt: 2026-10-02
  state: capability
  subjects: [buidl, ref:us-dollar]
  locator: '"Investors can transfer their tokens 24/7/365 to other pre-approved investors."'
  qualification: The same release says BUIDL may not be able to keep a stable value of 1 dollar per token at all times.

- id: buidl-service-providers
  statement: >-
    BUIDL's investment manager is BlackRock Financial Management, Bank of New York Mellon is custodian and administrator
    of its assets, and Securitize is transfer agent and tokenization platform, managing the tokenized shares and
    reporting subscriptions, redemptions and distributions.
  sourceUrl: https://www.silicon.co.uk/press-release/blackrock-launches-its-first-tokenized-fund-buidl-on-the-ethereum-network
  publisher: BlackRock and Securitize (press release, syndicated by Silicon UK)
  title: BlackRock Launches Its First Tokenized Fund, BUIDL, on the Ethereum Network
  sourcePublishedAt: 2024-03-20
  retrievedAt: 2026-10-02
  state: live
  subjects: [buidl, org:blackrock, org:securitize]
  locator: '"Securitize will act as a transfer agent and tokenization platform, managing the tokenized shares"'

- id: buidl-share-classes-2024
  statement: >-
    BlackRock announced on 13 November 2024 that BUIDL, launched on Ethereum in March 2024, would add share classes on
    Aptos, Arbitrum, Avalanche, OP Mainnet and Polygon.
  sourceUrl: https://www.prnewswire.com/news-releases/blackrock-launches-new-buidl-share-classes-across-multiple-blockchains-to-expand-access-and-potential-of-buidl-ecosystem-302304035.html
  publisher: BlackRock and Securitize (PR Newswire)
