- id: uniswap-v2-overview-pairs
  statement: >-
    Uniswap Labs' overview of v2 explains that every v1 pool paired ETH with a single ERC-20 token, so a swap between
    two other tokens, such as DAI for USDC, went through ETH and paid fees and slippage on two pools. In v2 any ERC-20
    token can be pooled directly with any other.
  sourceUrl: https://blog.uniswap.org/uniswap-v2
