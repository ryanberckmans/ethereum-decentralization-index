  locator: '"All investors utilizing the capability are pre-qualified and whitelisted through Securitize."'
  qualification: Neither the post nor the release names the blockchain BUIDL trades on through UniswapX. A request-for-quote system, not a Uniswap pool.

# PAXG ----------------------------------------------------------------------------------

- id: paxg-definition
  statement: >-
    Paxos defines PAXG as a token in which one token represents one fine troy ounce of a London Good Delivery gold bar
    stored in professional vaults. Holders have ownership rights to that gold, in the custody of Paxos Trust Company.
  sourceUrl: https://www.paxos.com/pax-gold
  publisher: Paxos
  title: Pax Gold (PAXG)
  retrievedAt: 2026-10-02
