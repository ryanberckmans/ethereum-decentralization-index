# Visa settlement -------------------------------------------------------------------

- id: visa-usdc-pilot-2021
  statement: >-
    In March 2021 Visa announced that it had settled a transaction in USDC over Ethereum, in a pilot run with Anchorage,
    its digital currency settlement partner, that let Crypto.com send USDC to Visa to settle a portion of its
    obligations for the Crypto.com Visa card program. Visa's standard process required partners to settle in a
