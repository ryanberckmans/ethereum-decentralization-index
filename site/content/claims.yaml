- id: buidl-uniswapx-2026
  statement: >-
    Uniswap Labs and Securitize announced on 11 February 2026 that BUIDL could be traded through UniswapX. Investors,
    each pre-qualified and whitelisted through Securitize, request quotes from whitelisted market makers, and trades
