  statement: >-
    OpenSea's changelog of 25 March 2024 announced its move to Seaport 1.6 and told developers that orders using the
    OpenSea Signed Zone must use the zone at 0x000056f7000000ece9003ca63978907a00ffd100 for Seaport 1.6. OpenSea's SDK
    lists the same address as its signed zone.
  sourceUrl: https://docs.opensea.io/changelog/seaport-v1-6
