  locator: '"Borrow USDC against bitcoin, without selling it. Rolling out to US users (ex. NY) starting now."'
  qualification: Read through X's public embed endpoint.

- id: morpho-coinbase-abstraction
  statement: >-
    Morpho's page on Coinbase's crypto-backed loans says the product gives Coinbase users onchain loans without the
    complexity of using DeFi directly: Coinbase handles the blockchain, wallets, gas fees and wrapping, customers borrow
    USDC against bitcoin in the Coinbase app, and the loans run on Morpho, with terms, collateral and balances
    verifiable on chain.
  sourceUrl: https://morpho.org/coinbase-loans
  publisher: Morpho
  title: Bitcoin-Backed Loans with Morpho
  retrievedAt: 2026-10-02
  state: live
  subjects: [product:coinbase-crypto-backed-loans, deployment:morpho-blue-base, org:coinbase]
  locator: '"Coinbase abstracts the blockchain itself, wallets, gas fees, and wrapping"'
  qualification: Morpho's description of a partner's product. The page's live dashboard figures are not used here.

