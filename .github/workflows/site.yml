# Checks the directory website in site/: installs its pinned dependencies,
# runs its integration tests, type-checks and builds it, then smoke-tests the
# built Worker. It runs only when site/ or this workflow changes, and it
# deploys nothing.
name: Site

on:
  pull_request:
    paths:
      - site/**
      - .github/workflows/site.yml
  push:
    branches: [main]
    paths:
      - site/**
      - .github/workflows/site.yml
  workflow_dispatch:

permissions: {}

concurrency:
  group: site-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Check and build the site
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    defaults:
      run:
        working-directory: site
    env:
      COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          package-manager-cache: false
      - name: Enable the pnpm version pinned in site/package.json
        run: corepack enable && pnpm --version
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run the integration tests
        run: pnpm check
      - name: Type-check
        run: pnpm exec tsc --noEmit
      - name: Build
        run: pnpm build
      - name: Smoke-test the built Worker
        run: node tests/http-smoke.mjs
