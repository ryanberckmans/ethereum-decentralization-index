# Checks the directory website in site/: its editorial content, types and unit
# tests, the production build, and browser tests against the built Worker
# (search and saved state, review dates, accessibility in both themes, phone
# budgets, security headers, and all eight languages on phone widths).
# It runs when the site, the EDI package it reads, or this workflow changes,
# and it deploys nothing; see site-deploy.yml.
name: Site

on:
  pull_request:
    paths:
      - site/**
      - data/**
      - dist/**
      - package.json
      - .github/workflows/site.yml
  push:
    branches: [main]
    paths:
      - site/**
      - data/**
      - dist/**
      - package.json
      - .github/workflows/site.yml
  workflow_dispatch:

permissions: {}

concurrency:
  group: site-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Check, build and test the site
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          package-manager-cache: false
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Check the editorial content
        run: npm run content:check
      - name: Type-check
        run: npm run typecheck
      - name: Run the unit tests
        run: npm test
      - name: Build
        run: npm run build
      - name: Install the test browser
        run: npx playwright install --with-deps chromium
      - name: Run the browser tests against the built Worker
        run: npm run test:e2e
