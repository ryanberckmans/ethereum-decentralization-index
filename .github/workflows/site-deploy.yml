# Deploys the directory website to Cloudflare Workers.
#
# It runs after the Site workflow passes on a push to main, deploying exactly
# the commit that was tested, or on demand from the Actions tab. Nothing is
# deployed until the repository has two secrets: CLOUDFLARE_API_TOKEN (a token
# with the "Edit Cloudflare Workers" permission) and CLOUDFLARE_ACCOUNT_ID.
# Until then the run ends with a notice. The optional SITE_URL repository
# variable (for example https://directory.example.org) sets the canonical
# address used in links, sitemaps and social cards; without it, pages use the
# address they were requested at.
name: Deploy site

on:
  workflow_run:
    workflows: [Site]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: site-deploy
  cancel-in-progress: false

jobs:
  ready:
    name: Check for Cloudflare credentials
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    # A tested push to this repository's main branch, or a manual run.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository)
    outputs:
      ready: ${{ steps.check.outputs.ready }}
    steps:
      - id: check
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$TOKEN" ] && [ -n "$ACCOUNT" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Site not deployed::Add the CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID repository secrets to deploy the site."
          fi

  deploy:
    name: Build and deploy to Cloudflare Workers
    needs: ready
    if: needs.ready.outputs.ready == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          package-manager-cache: false
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Check the editorial content and run the unit tests
        run: npm run content:check && npm test
      - name: Build
        env:
          PUBLIC_SITE_URL: ${{ vars.SITE_URL }}
        run: npm run build
      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_SEND_METRICS: "false"
        run: npx wrangler deploy
